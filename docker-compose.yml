services:
  postgres:
    image: postgres:16
    container_name: pitstop-postgres
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      POSTGRES_USER: pitstop
      POSTGRES_PASSWORD: pitstop
      POSTGRES_DB: pitstop
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pitstop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pitstop_postgres_data:
