services:
  postgres:
    image: postgres:16
    container_name: pitstop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitstop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitstop}
      POSTGRES_DB: ${POSTGRES_DB:-pitstop}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pitstop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pitstop_postgres_data:
