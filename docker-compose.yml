services:
  postgres:
    image: postgres:16
    container_name: pitstop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pitstop
      POSTGRES_PASSWORD: pitstop
      POSTGRES_DB: pitstop
    ports:
      - '5432:5432'
    volumes:
      - pitstop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pitstop -d pitstop']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pitstop_postgres_data:
